name = "fmn-push"
main = "src/index.ts"
compatibility_date = "2024-11-01"
# node:crypto fallback used by the web-push lib; harmless, Web Crypto is used on edge.
compatibility_flags = ["nodejs_compat"]

# Cron: check for due tasks every minute and send Web Push.
[triggers]
crons = ["* * * * *"]

# Public VAPID key + subject are safe to ship as plain vars.
# The PRIVATE key is a secret: `wrangler secret put VAPID_PRIVATE_KEY`
# (locally it comes from .dev.vars — gitignored).
[vars]
VAPID_SUBJECT = "mailto:elijahlucian@gmail.com"
VAPID_PUBLIC_KEY = "BGuVyu-qrtAg-SdnuhPbS_FjsVqDEwBiFIT9UNSLC1QDHY4Uvfncivoj0G5_JdYbG-_vqF8tERHW-U3HcXOXzfw"
# Allowed browser origins for CORS (comma-separated).
ALLOWED_ORIGINS = "https://tasks.lucianlabs.ca,http://localhost:5173"

[[d1_databases]]
binding = "DB"
database_name = "fmn-push"
# Filled in by `wrangler d1 create fmn-push` — paste the printed database_id here.
database_id = "PLACEHOLDER_RUN_D1_CREATE"

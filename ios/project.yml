name: ForgetMeNot
options:
  bundleIdPrefix: com.lucianlabs
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ForgetMeNot:
    type: application
    platform: iOS
    sources: [ForgetMeNot]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucianlabs.forgetmenot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: ForgetMeNot/Audio/pocketwave/PocketWaveBridge.h
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ForgetMeNot/Info.plist
        CODE_SIGN_STYLE: Automatic
        # Debug uses the development APS entitlement (+ local MCP server); Release ships the
        # App Store entitlements: production push + Mac App Store sandbox, no local server.
        CODE_SIGN_ENTITLEMENTS: ForgetMeNot/ForgetMeNot.entitlements
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: ForgetMeNot/ForgetMeNot.Release.entitlements
    info:
      path: ForgetMeNot/Info.plist
      properties:
        CFBundleDisplayName: Forget Me Not
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        FMNBuildRev: "$(FMN_BUILD_REV)"
        # remote-notification: CloudKit silent pushes. (processing was declared but never
        # used — an automatic App Review rejection — so it's gone.)
        UIBackgroundModes: [remote-notification]
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # Required by App Store validation. iPad lists all four (iPad multitasking
        # demands it for non-fullscreen apps); iPhone skips upside-down portrait.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Bundled web-theme fonts (latin subsets, OFL) — see ForgetMeNot/Fonts/.
        UIAppFonts:
          - FMNBebasNeue-Regular.ttf
          - FMNCormorantGaramond-Bold.ttf
          - FMNCormorantGaramond-Regular.ttf
          - FMNFiraCode-Bold.ttf
          - FMNFiraCode-Regular.ttf
          - FMNIBMPlexMono-Bold.ttf
          - FMNIBMPlexMono-Regular.ttf
          - FMNInter-Bold.ttf
          - FMNInter-Regular.ttf
          - FMNJetBrainsMono-Bold.ttf
          - FMNJetBrainsMono-Regular.ttf
          - FMNJosefinSans-Bold.ttf
          - FMNJosefinSans-Regular.ttf
          - FMNKaiseiTokumin-Bold.ttf
          - FMNKaiseiTokumin-Regular.ttf
          - FMNLora-Bold.ttf
          - FMNLora-Regular.ttf
          - FMNNotoSansJp-Bold.ttf
          - FMNNotoSansJp-Regular.ttf
          - FMNNunito-Bold.ttf
          - FMNNunito-Regular.ttf
          - FMNOpenSans-Bold.ttf
          - FMNOpenSans-Regular.ttf
          - FMNOrbitron-Bold.ttf
          - FMNOrbitron-Regular.ttf
          - FMNPlayfairDisplay-Bold.ttf
          - FMNPlayfairDisplay-Regular.ttf
          - FMNPoppins-Bold.ttf
          - FMNPoppins-Regular.ttf
          - FMNQuicksand-Bold.ttf
          - FMNQuicksand-Regular.ttf
          - FMNRaleway-Bold.ttf
          - FMNRaleway-Regular.ttf
          - FMNSourceSerif4-Bold.ttf
          - FMNSourceSerif4-Regular.ttf
          - FMNSpaceMono-Bold.ttf
          - FMNSpaceMono-Regular.ttf
    scheme:
      # Silence the os_log firehose. NSPersistentCloudKitContainer logs a flood of "queue
      # operation" mirroring chatter to the Xcode console once sync is active — Apple's own
      # logging, with no public flag to quiet just CloudKit. Trade-off: this also hides the app's
      # own os.Logger output when running from Xcode; remove it temporarily to get logs back.
      environmentVariables:
        OS_ACTIVITY_MODE: disable
  ForgetMeNotTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ForgetMeNotTests]
    dependencies:
      - target: ForgetMeNot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

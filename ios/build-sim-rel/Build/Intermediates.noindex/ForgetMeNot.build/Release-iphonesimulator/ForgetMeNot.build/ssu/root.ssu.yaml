apiVersion: ssu/v1
nlu:
  shortcuts:
    bundleIdentifier: com.lucianlabs.forgetmenot
    intents:
    - metadata:
        name: ResetLoopIntent_0
        title: Reset a Task
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }I did a task in ${+applicationName}'
          - '{${+prefix} }Reset a task in ${+applicationName}'
          - '{${+prefix} }Reset my ${+applicationName} task'
    - metadata:
        name: OverdueIntent_1
        title: What Am I Forgetting
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }What am I forgetting in ${+applicationName}'
          - '{${+prefix} }What''s overdue in ${+applicationName}'
          - '{${+prefix} }What''s due in ${+applicationName}'
    - metadata:
        name: CompleteTaskIntent_2
        title: Complete a Task
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }Complete a task in ${+applicationName}'
          - '{${+prefix} }Finish a task in ${+applicationName}'
    - metadata:
        name: AddTaskIntent_3
        title: Add a Task
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }Add a task in ${+applicationName}'
          - '{${+prefix} }Remember something with ${+applicationName}'
    - metadata:
        name: LogNoteIntent_4
        title: Log a Note
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }Log a note in ${+applicationName}'
    - metadata:
        name: +negative
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }${+standardAppShortcutNegatives}'
variables:
- name: +applicationName
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
    - Forget Me Not
- name: TaskItemEntity
  type: ssu/parameter
  definitions:
  - locale: en
    synomyms:
    - Task
- name: +prefix
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
      $ref: ssu://Resources/prefix/en.yaml
- name: +standardAppShortcutNegatives
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
      $ref: ssu://Resources/standardAppShortcutNegatives/en.yaml

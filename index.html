    <!-- slip node arrival: before first paint, hold the page in the colour of the
         curtain it came through, so a jump has no blank frame. The dock stays
         visible; ll-ring.js lifts the rest. Spec: github.com/lucian-labs/slip-node -->
    <script>(function(){try{var q=new URLSearchParams(location.search);if(q.get('slip')!=='1'&&q.get('ll')!=='ring')return;var bg=q.get('slipbg')||q.get('llbg')||'';if(!/^(#[0-9a-f]{3,8}|rgba?\([0-9 .,%]+\))$/i.test(bg))bg='#060a10';var d=document.documentElement;d.setAttribute('data-slip-arriving','');d.setAttribute('data-ll-arriving','');d.style.setProperty('background',bg,'important');var s=document.createElement('style');s.textContent='html[data-slip-arriving] body{visibility:hidden}html[data-slip-arriving] ll-dock,html[data-slip-arriving] [data-slip-keep]{visibility:visible}';document.head.appendChild(s);setTimeout(function(){d.removeAttribute('data-slip-arriving');d.removeAttribute('data-ll-arriving');d.style.removeProperty('background')},2500)}catch(e){}})()</script>
